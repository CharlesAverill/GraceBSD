name: Release

on:
  push:
    branches: [main]
    # Only the files that go into the ISO, so commits that can't change it
    # (docs, licenses, formatting config) don't make a release
    paths:
      - "kernel/**"
      - "boot/**"
      - "Makefile"
      - "media/splash.bmp"
      - "tools/bmp_to_rgb.py"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget python3 xorriso

      - name: Build
        run: make GraceBSD.iso

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" GraceBSD.iso THIRD_PARTY_LICENSES \
            --target "${{ github.sha }}" \
            --title "GraceBSD build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}."
