# Timeout in seconds that Limine will use before automatically booting.
timeout: 3

# Boot menu wallpaper. Global options like this must come before the first
# entry; inside an entry they are ignored. Repeating the option makes Limine
# pick one at random each boot.
wallpaper: boot():/boot/limine/finches1.png
wallpaper: boot():/boot/limine/finches2.png
wallpaper: boot():/boot/limine/finches3.png
wallpaper: boot():/boot/limine/finches4.png
wallpaper_style: centered
# Colour around a centered wallpaper, in RRGGBB format
backdrop: ffffff

# The entry name that will be displayed in the boot menu.
/GraceBSD
    # We use the Limine boot protocol.
    protocol: limine

    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    path: boot():/boot/kernel
